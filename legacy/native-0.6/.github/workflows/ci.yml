name: Rust CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: Build preview
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release --locked -p forge-desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
      - name: Package macOS preview
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        run: |
          mkdir -p preview
          packaging/macos/package.sh target/release/forgeide preview/ForgeIDE-macOS.zip
          packaging/macos/disk-image.sh preview/ForgeIDE-macOS.zip preview/ForgeIDE-macOS.dmg
      - name: Package Windows preview
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path preview
          New-Item -ItemType Directory -Path preview/staging
          Copy-Item target/release/forgeide.exe preview/staging
          Copy-Item crates/forge-desktop/assets/*-OFL.txt preview/staging
          Compress-Archive -Path preview/staging/* -DestinationPath preview/ForgeIDE-Windows.zip
          Remove-Item -Recurse preview/staging
      - name: Package Linux preview
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        run: |
          mkdir -p preview
          packaging/linux/package.sh target/release/forgeide preview/ForgeIDE-Linux.deb
      - name: Upload preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ForgeIDE-${{ matrix.os }}
          path: preview/*
          if-no-files-found: error
