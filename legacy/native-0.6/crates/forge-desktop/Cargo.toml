[package]
name = "forge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "forgeide"
path = "src/main.rs"

[dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"
semver = "=1.0.28"
fs2 = "=0.4.3"
regex = "=1.13.1"
forge-text = { path = "../forge-text" }
eframe = { version = "=0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "=0.15.3", default-features = false, features = ["xdg-portal", "async-std"] }
tempfile = "=3.20.0"
tree-sitter-highlight = "=0.24.7"
tree-sitter = "=0.24.7"
tree-sitter-rust = "=0.23.2"
tree-sitter-typescript = "=0.23.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
url = "=2.5.8"
wasmi = { version = "=0.40.0", default-features = false, features = ["std"] }

[dev-dependencies]
wat = "=1.225.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
