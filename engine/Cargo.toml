[package]
name = "forge-engine"
version = "0.9.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[features]
fault-injection = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
fs2 = "=0.4.3"
tempfile = "=3.20.0"
unicode-normalization = "=0.1.24"
tree-sitter = "=0.25.10"
tree-sitter-language = "=0.1.5"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.0"
toml = "=0.8.23"

[[bin]]
name = "forge-parser"
path = "src/parser.rs"

[profile.release]
strip = true
lto = "thin"
[profile.dev]
debug = 0
[profile.test]
debug = 0
