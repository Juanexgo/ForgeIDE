name: Collect verified alpha installers
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the completed three-platform check
        run: |
          test "$(gh api repos/Juanexgo/ForgeIDE/actions/runs/44879776714 --jq '.conclusion')" = success
          test "$(gh api repos/Juanexgo/ForgeIDE/actions/runs/44879776714 --jq '.head_sha' | cut -c1-7)" = 8553f1e
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-preview-windows-latest
          run-id: 44876977785
          github-token: ${{ github.token }}
          path: incoming/windows
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-preview-ubuntu-24.04
          run-id: 44878027543
          github-token: ${{ github.token }}
          path: incoming/linux
      - name: Hash and normalize installer assets without executing them
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
          fs.mkdirSync('release-assets');const assets=[];
          for(const [dir,platform,extensions,run,commit] of [['windows','win32',['exe'],44876977785,'1489c3693f55fd892a13a0085d9cc3205dd169fd'],['linux','linux',['deb','AppImage'],44878027543,'e8a7b5c5bf8da6af167efeb1a7e9705721db2def']]){
            for(const ext of extensions){const candidates=fs.readdirSync('incoming/'+dir).filter(n=>n.endsWith('.'+ext));if(candidates.length!==1)throw Error('Expected exactly one '+ext+' installer');const input=path.join('incoming',dir,candidates[0]),name='ForgeIDE-0.9.0-alpha.1-'+(platform==='win32'?'Windows':'Linux')+'-x64.'+ext,output='release-assets/'+name;const data=fs.readFileSync(input);if(ext==='exe'&&data.subarray(0,2).toString()!=='MZ'||ext==='AppImage'&&!data.subarray(0,4).equals(Buffer.from([127,69,76,70]))||ext==='deb'&&data.subarray(0,8).toString()!=='!<arch>\n')throw Error('Unexpected installer format');fs.copyFileSync(input,output);assets.push({name,platform,arch:'x64',kind:ext,bytes:data.length,sha256:createHash('sha256').update(data).digest('hex'),sourceCommit:commit,run,unsigned:true});}}
          fs.writeFileSync('release-assets/native-installers.json',JSON.stringify({release:'0.9.0-alpha.1',checks:44879776714,assets},null,2)+'\n');
          JS
      - name: Attach installers to a draft alpha release
        run: |
          if ! gh release view v0.9.0-alpha.1 >/dev/null 2>&1; then
            gh release create v0.9.0-alpha.1 --draft --prerelease --target 8553f1e --title 'ForgeIDE 0.9.0 alpha 1' --notes 'Alpha installers without operating-system distribution signatures. See docs/ESTADO-COMPLETO.md for tested scope and known limits.'
          fi
          gh release upload v0.9.0-alpha.1 release-assets/* --clobber
