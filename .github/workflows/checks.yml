name: ForgeIDE checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - name: Dependency advisory gate
        if: runner.os == 'Linux'
        run: node scripts/audit-gate.mjs
      - run: yarn build:engine
      - run: yarn build:extension
      - run: yarn run typecheck
      - run: yarn test
      - run: cargo build --locked --manifest-path engine/Cargo.toml --features fault-injection
      - name: Crash recovery integration
        shell: bash
        run: |
          export FORGE_ENGINE_FAULT_PATH="$PWD/engine/target/debug/forge-engine"
          if [ "$RUNNER_OS" = Windows ]; then export FORGE_ENGINE_FAULT_PATH="${FORGE_ENGINE_FAULT_PATH}.exe"; fi
          yarn test:crash
      - run: yarn download:plugins
      - run: yarn prepare:qa
      - run: yarn test:protocol
      - run: yarn rebuild
      - run: yarn build
      - name: Download verification runtime
        if: runner.os == 'Linux'
        run: |
          docker pull node:24-alpine
          docker pull python:3.13-alpine
      - name: Real isolated verification integration
        if: runner.os == 'Linux'
        run: node --test tests/integration/docker.test.cjs
      - name: Locked public dependency profiles
        if: runner.os == 'Linux'
        run: yarn test:dependencies
      - name: Reproducible graph fixture benchmark
        if: runner.os == 'Linux'
        run: node scripts/benchmark.mjs
      - name: Preserve test and build manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ matrix.os }}
          path: |
            benchmarks/*.json
            yarn.lock
            package.json
            apps/desktop/package.json
